name: Android CI

# Solo tests. El APK debug se arma en la máquina de Felipe y se sube a Releases
# a mano (ver AGENTS.md). No publicar APKs desde aquí.

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
